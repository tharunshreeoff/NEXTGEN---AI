name: Refresh official AI feeds
on:
  schedule:
    # Daily at 12:15 IST (06:45 UTC)
    - cron: "45 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-ai-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official RSS feeds
        run: python scripts/update_feed.py
      - name: Commit feed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh daily AI feed"
            git push
          else
            echo "No feed changes."
          fi
